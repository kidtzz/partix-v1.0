<style>
    .dash-card {
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: var(--surface-color);
    }

    .dash-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .dash-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        z-index: 0;
        opacity: 0.5;
    }

    .dash-card>div {
        position: relative;
        z-index: 1;
    }

    .dash-icon-box {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5);
    }

    .dash-title {
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }

    .dash-value {
        font-size: 32px;
        font-weight: 800;
        line-height: 1.2;
    }

    .dash-table-card {
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        border: 1px solid rgba(0, 0, 0, 0.05);
    }
</style>

<div id="view-dashboard" class="view-section">
    <div class="view-header">
        <div>
            <h2 class="view-title">Dashboard & Laporan</h2>
            <div style="color: var(--text-muted); margin-top: 4px;">Ringkasan Kondisi Toko secara Real-time</div>
        </div>
    </div>

    <!-- Statistik Cards -->
    <div class="grid"
        style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 32px;">
        <div class="dash-card"
            style="background: linear-gradient(135deg, #ffffff 0%, #f4f8ff 100%); border-left: 5px solid var(--primary-color);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="dash-title" style="color: var(--primary-color);">Total Stock Barang</div>
                    <div id="dashTotalStock" class="dash-value" style="color: #2c3e50;">...</div>
                </div>
                <div class="dash-icon-box" style="background: rgba(74, 144, 226, 0.15); color: var(--primary-color);">
                    <i class='bx bx-box'></i>
                </div>
            </div>
        </div>

        <div class="dash-card"
            style="background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%); border-left: 5px solid var(--success-color);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="dash-title" style="color: var(--success-color);">Penjualan Hari Ini</div>
                    <div id="dashTotalSales" class="dash-value" style="color: #2c3e50;">...</div>
                </div>
                <div class="dash-icon-box" style="background: rgba(46, 204, 113, 0.15); color: var(--success-color);">
                    <i class='bx bx-cart'></i>
                </div>
            </div>
        </div>

        <div class="dash-card"
            style="background: linear-gradient(135deg, #ffffff 0%, #fffbf0 100%); border-left: 5px solid var(--warning-color);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="dash-title" style="color: var(--warning-color);">Pendapatan Hari Ini</div>
                    <div id="dashTotalRevenue" class="dash-value" style="color: #2c3e50;">...</div>
                </div>
                <div class="dash-icon-box" style="background: rgba(243, 156, 18, 0.15); color: var(--warning-color);">
                    <i class='bx bx-money'></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Grafik Penjualan -->
    <div class="card dash-table-card" style="margin-bottom: 32px; padding: 24px; background: #ffffff;">
        <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 18px; color: var(--text-dark); display: flex; align-items: center; gap: 10px;">
            <i class='bx bx-line-chart' style="color: var(--primary-color);"></i> Grafik Growth Penjualan (7 Hari Terakhir)
        </h3>
        <div style="height: 300px; width: 100%;">
            <canvas id="salesGrowthChart"></canvas>
        </div>
    </div>

    <!-- Peringatan Stok -->
    <div class="card dash-table-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3
                style="display: flex; align-items: center; gap: 10px; color: var(--danger-color); font-size: 18px; margin: 0;">
                <div
                    style="width: 36px; height: 36px; border-radius: 50%; background: rgba(231, 76, 60, 0.1); display: flex; align-items: center; justify-content: center;">
                    <i class='bx bx-error-circle' style="font-size: 22px;"></i>
                </div>
                Notifikasi Stock Minimum
            </h3>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID Barang</th>
                        <th>Nama Barang</th>
                        <th>Sisa Stok</th>
                        <th>Batas Minimum</th>
                        <th>Satuan</th>
                    </tr>
                </thead>
                <tbody id="dashLowStockTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center;">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let isDashboardLoaded = false;

    function initDashboardView() {
        if (AppState.user.role !== "Admin") {
            // Tolak akses jika bukan Admin
            showToast("Akses ditolak. Hanya Admin yang dapat melihat Dashboard.", "error");
            switchView('penjualan');
            return;
        }

        if (isDashboardLoaded) return; // Supaya tidak load terus saat pindah menu
        loadDashboardData();
    }

    function loadDashboardData() {
        document.getElementById('dashTotalStock').textContent = "...";
        document.getElementById('dashTotalSales').textContent = "...";
        document.getElementById('dashTotalRevenue').textContent = "...";
        document.getElementById('dashLowStockTableBody').innerHTML = `<tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>`;

        BackendAPI.call('getDashboardStats').then(stats => {
            document.getElementById('dashTotalStock').textContent = stats.totalStockBarang.toLocaleString('id-ID');
            document.getElementById('dashTotalSales').textContent = stats.totalPenjualanHariIni.toLocaleString('id-ID') + " Trx";
            document.getElementById('dashTotalRevenue').textContent = "Rp " + stats.totalPendapatanHariIni.toLocaleString('id-ID');

            const tbody = document.getElementById('dashLowStockTableBody');
            if (stats.notifikasiStockMinimum.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--success-color);">Semua stok barang aman.</td></tr>`;
            } else {
                tbody.innerHTML = stats.notifikasiStockMinimum.map(b => `
                    <tr>
                        <td style="font-weight: 600;">${b.id_barang}</td>
                        <td>${b.nama_barang}</td>
                        <td><span class="badge badge-secondary" style="background: rgba(231, 76, 60, 0.1); color: var(--danger-color);">${b.stok_saat_ini}</span></td>
                        <td>${b.minimum_stock}</td>
                        <td>${b.satuan}</td>
                    </tr>
                `).join('');
            }
            
            // Render Chart
            renderSalesChart(stats.dailySales);
            
            isDashboardLoaded = true;
        }).catch(err => {
            showToast("Gagal memuat Dashboard: " + err.message, "error");
            document.getElementById('dashLowStockTableBody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger-color);">Error: ${err.message}</td></tr>`;
        });
    }

    let salesChartInstance = null;
    function renderSalesChart(dailySales) {
        const ctx = document.getElementById('salesGrowthChart').getContext('2d');
        
        // Generate last 7 days dates for X axis
        const labels = [];
        const dataPoints = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toLocaleString('en-CA', { timeZone: 'Asia/Jakarta' }).split(',')[0].trim();
            labels.push(dateStr);
            dataPoints.push((dailySales && dailySales[dateStr]) ? dailySales[dateStr] : 0);
        }

        if (salesChartInstance) {
            salesChartInstance.destroy();
        }

        salesChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Pendapatan (Rp)',
                    data: dataPoints,
                    borderColor: '#4F46E5',
                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                    borderWidth: 2,
                    pointBackgroundColor: '#4F46E5',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#4F46E5',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) label += ': ';
                                if (context.parsed.y !== null) {
                                    label += 'Rp ' + context.parsed.y.toLocaleString('id-ID');
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return 'Rp ' + value.toLocaleString('id-ID');
                            }
                        }
                    }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.target.id === 'view-dashboard' && mutation.target.classList.contains('active')) {
                    initDashboardView();
                }
            });
        });
        const view = document.getElementById('view-dashboard');
        if (view) observer.observe(view, { attributes: true, attributeFilter: ['class'] });
    });
</script>
