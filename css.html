<style>
    /* =========================================
       PARTIX POS & Inventory System
       Responsive Design System & CSS Theme
       ========================================= */

    :root {
        /* Color Palette */
        --primary-color: #4F46E5;
        /* Indigo */
        --primary-hover: #4338CA;
        --primary-light: rgba(79, 70, 229, 0.1);

        --secondary-color: #10B981;
        /* Emerald / Success */
        --secondary-hover: #059669;

        --danger-color: #EF4444;
        /* Red */
        --danger-hover: #DC2626;

        --warning-color: #F59E0B;
        /* Amber */
        --warning-hover: #D97706;

        --info-color: #3B82F6;
        /* Blue */

        --bg-color: #F3F4F6;
        --surface-color: rgba(255, 255, 255, 0.75);
        --surface-solid: #FFFFFF;

        --text-main: #111827;
        --text-muted: #6B7280;
        --text-light: #9CA3AF;

        --border-color: rgba(255, 255, 255, 0.4);
        --border-solid: #E5E7EB;

        /* Shadows & Glass Effects */
        --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
        --shadow-lg: 0 12px 24px -4px rgba(0, 0, 0, 0.12), 0 4px 8px -2px rgba(0, 0, 0, 0.06);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);

        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-full: 9999px;

        /* Transitions */
        --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* =========================================
       Base Reset & Touch Optimization
       ========================================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        background-image:
            radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.04) 0, transparent 50%),
            radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.03) 0, transparent 50%),
            radial-gradient(at 100% 0%, rgba(245, 158, 11, 0.03) 0, transparent 50%);
        color: var(--text-main);
        display: flex;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: -0.01em;
    }

    button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        outline: none;
        touch-action: manipulation;
    }

    input,
    select,
    textarea {
        font-family: inherit;
        outline: none;
    }

    /* Custom Webkit Scrollbars */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.4);
        border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: rgba(107, 114, 128, 0.7);
    }

    /* =========================================
       Glassmorphism Utilities
       ========================================= */
    .glass-effect {
        background: var(--surface-color);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        box-shadow: var(--glass-shadow);
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
    }

    .glass-card:hover {
        box-shadow: var(--shadow-md);
        background: rgba(255, 255, 255, 0.9);
    }

    /* =========================================
       App Layout Architecture
       ========================================= */
    .app-container {
        display: flex;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        /* Dynamic viewport height support for mobile browsers */
        position: relative;
        overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
        width: 260px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 24px 16px;
        z-index: 100;
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        transition: transform var(--transition-normal);
        flex-shrink: 0;
    }

    .sidebar-header {
        margin-bottom: 32px;
        padding-left: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 700;
        color: var(--primary-color);
        letter-spacing: -0.5px;
    }

    .logo i {
        font-size: 28px;
        background: linear-gradient(135deg, var(--primary-color), #818CF8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .nav-links {
        list-style: none;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
        padding-right: 4px;
    }

    .nav-header {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px 14px 4px 14px;
        margin-top: 4px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        color: var(--text-muted);
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: all var(--transition-fast);
        user-select: none;
    }

    .nav-item:hover {
        background: rgba(255, 255, 255, 0.7);
        color: var(--primary-color);
    }

    .nav-item.active {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .nav-item.active i {
        color: white;
    }

    .nav-item i {
        font-size: 20px;
        transition: color var(--transition-fast);
    }

    .user-profile {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 12px;
        border-top: 1px solid var(--border-solid);
        background: rgba(255, 255, 255, 0.4);
        border-radius: var(--radius-md);
    }

    .avatar {
        width: 38px;
        height: 38px;
        border-radius: var(--radius-full);
        background: linear-gradient(135deg, #C7D2FE, #E0E7FF);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-color);
        font-size: 20px;
        flex-shrink: 0;
    }

    .user-info {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .user-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .user-role {
        font-size: 11px;
        color: var(--text-muted);
    }

    /* Main Content */
    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        position: relative;
        min-width: 0;
        /* Prevents flex items from overflowing horizontally */
    }

    .topbar {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: transparent;
        flex-shrink: 0;
        z-index: 10;
    }

    .date-time {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
    }

    .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        background: rgba(255, 255, 255, 0.6);
        padding: 6px 14px;
        border-radius: var(--radius-full);
        border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }

    .status-dot.online {
        background-color: var(--secondary-color);
        box-shadow: 0 0 8px var(--secondary-color);
    }

    .views-container {
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    .view-section {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        visibility: hidden;
        transition: opacity var(--transition-normal), transform var(--transition-normal);
        transform: translateY(10px);
        overflow-y: auto;
        padding: 0 24px 24px 24px;
        -webkit-overflow-scrolling: touch;
    }

    .view-section.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        z-index: 1;
    }

    .view-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 16px;
        flex-wrap: wrap;
    }

    .view-title {
        font-size: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
    }

    .view-title i {
        color: var(--primary-color);
        background: var(--primary-light);
        padding: 8px;
        border-radius: var(--radius-md);
        font-size: 22px;
    }

    /* =========================================
       Reusable UI Components
       ========================================= */

    /* Buttons */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        min-height: 42px;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 500;
        transition: all var(--transition-fast);
        border: 1px solid transparent;
        user-select: none;
        white-space: nowrap;
    }

    .btn:active {
        transform: scale(0.97);
    }

    .btn-primary {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover {
        background: var(--primary-hover);
        box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    .btn-secondary {
        background: white;
        color: var(--text-main);
        border-color: var(--border-solid);
        box-shadow: var(--shadow-xs);
    }

    .btn-secondary:hover {
        background: #F9FAFB;
        border-color: #D1D5DB;
    }

    .btn-danger {
        background: #FEF2F2;
        color: var(--danger-color);
        border-color: #FCA5A5;
    }

    .btn-danger:hover {
        background: #FEE2E2;
        color: var(--danger-hover);
    }

    .btn-success {
        background: var(--secondary-color);
        color: white;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-success:hover {
        background: var(--secondary-hover);
    }

    .btn-icon {
        padding: 8px;
        min-width: 40px;
        min-height: 40px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        background: transparent;
        transition: all var(--transition-fast);
    }

    .btn-icon:hover {
        background: rgba(0, 0, 0, 0.05);
        color: var(--text-main);
    }

    /* Input Controls */
    .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
    }

    .input-group label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
    }

    .input-control {
        width: 100%;
        min-height: 42px;
        padding: 10px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-solid);
        background: rgba(255, 255, 255, 0.85);
        font-size: 14px;
        color: var(--text-main);
        transition: all var(--transition-fast);
    }

    .input-control:focus {
        border-color: var(--primary-color);
        background: white;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .search-bar {
        position: relative;
        width: 100%;
        max-width: 360px;
    }

    .search-bar i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 18px;
        pointer-events: none;
    }

    .search-bar input {
        width: 100%;
        min-height: 42px;
        padding: 10px 14px 10px 40px;
        border-radius: var(--radius-full);
        border: 1px solid rgba(255, 255, 255, 0.7);
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(8px);
        font-size: 14px;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        transition: all var(--transition-fast);
    }

    .search-bar input:focus {
        background: white;
        border-color: var(--primary-color);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    /* Tables & Responsive Containers */
    .table-container {
        width: 100%;
        overflow-x: auto;
        background: var(--surface-solid);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-solid);
        -webkit-overflow-scrolling: touch;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        white-space: nowrap;
    }

    th,
    td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-solid);
    }

    th {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: #F9FAFB;
        position: sticky;
        top: 0;
        z-index: 2;
    }

    td {
        font-size: 14px;
        color: var(--text-main);
    }

    tbody tr {
        transition: background var(--transition-fast);
    }

    tbody tr:hover {
        background: #F9FAFB;
    }

    /* Badges */
    .badge {
        padding: 4px 10px;
        border-radius: var(--radius-full);
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .badge-primary {
        background: var(--primary-light);
        color: var(--primary-color);
    }

    .badge-success {
        background: #D1FAE5;
        color: #065F46;
    }

    .badge-warning {
        background: #FEF3C7;
        color: #92400E;
    }

    .badge-danger {
        background: #FEE2E2;
        color: #991B1B;
    }

    /* Modals & Dialogs */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: rgba(17, 24, 39, 0.45);
        backdrop-filter: blur(4px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity var(--transition-normal), visibility var(--transition-normal);
        padding: 16px;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal-content {
        background: white;
        border-radius: var(--radius-xl);
        width: 100%;
        max-width: 520px;
        box-shadow: var(--shadow-lg);
        transform: scale(0.95) translateY(20px);
        transition: transform var(--transition-normal);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        max-height: 90vh;
        max-height: 90dvh;
    }

    .modal-overlay.active .modal-content {
        transform: scale(1) translateY(0);
    }

    .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-solid);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #FAFAFA;
    }

    .modal-header h3 {
        font-size: 18px;
        margin: 0;
    }

    .modal-close {
        background: transparent;
        border: none;
        font-size: 24px;
        color: var(--text-muted);
        cursor: pointer;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }

    .modal-close:hover {
        background: #F3F4F6;
        color: var(--text-main);
    }

    .modal-body {
        padding: 24px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border-solid);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        background: #F9FAFB;
    }

    /* Toasts / Notifications */
    .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
    }

    .toast {
        background: white;
        border-radius: var(--radius-md);
        padding: 14px 18px;
        box-shadow: var(--shadow-lg);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 280px;
        max-width: 420px;
        transform: translateX(120%);
        opacity: 0;
        transition: all var(--transition-normal);
        border-left: 4px solid var(--primary-color);
        pointer-events: auto;
    }

    .toast.show {
        transform: translateX(0);
        opacity: 1;
    }

    .toast-icon {
        font-size: 22px;
        color: var(--primary-color);
        flex-shrink: 0;
    }

    .toast-success {
        border-left-color: var(--secondary-color);
    }

    .toast-success .toast-icon {
        color: var(--secondary-color);
    }

    .toast-error {
        border-left-color: var(--danger-color);
    }

    .toast-error .toast-icon {
        color: var(--danger-color);
    }

    .toast-message {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-main);
    }

    /* Global Layout Utility Helpers */
    .grid {
        display: grid;
    }

    .flex {
        display: flex;
    }

    .items-center {
        align-items: center;
    }

    .justify-between {
        justify-content: space-between;
    }

    .gap-2 {
        gap: 8px;
    }

    .gap-4 {
        gap: 16px;
    }

    .mt-3 {
        margin-top: 12px;
    }

    .mt-4 {
        margin-top: 16px;
    }

    .mb-0 {
        margin-bottom: 0 !important;
    }

    .mb-4 {
        margin-bottom: 16px;
    }

    .w-full {
        width: 100%;
    }

    /* Login Screen Overlay */
    #loginScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: inherit;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        transition: opacity var(--transition-normal), visibility var(--transition-normal);
    }

    #loginScreen.hidden {
        opacity: 0;
        visibility: hidden;
    }

    .login-card {
        width: 100%;
        max-width: 400px;
        padding: 36px 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        text-align: center;
    }

    .login-logo {
        font-size: 30px;
        font-weight: 700;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 4px;
    }

    .login-logo i {
        font-size: 38px;
        background: linear-gradient(135deg, var(--primary-color), #818CF8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
        color: var(--text-muted);
        font-size: 13px;
        margin-bottom: 12px;
    }

    /* Mobile Menu Controls */
    .mobile-menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 24px;
        color: var(--text-main);
        cursor: pointer;
        padding: 8px;
        border-radius: var(--radius-md);
        transition: background var(--transition-fast);
    }

    .mobile-menu-toggle:hover {
        background: rgba(0, 0, 0, 0.05);
    }

    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: rgba(17, 24, 39, 0.4);
        backdrop-filter: blur(2px);
        z-index: 90;
        opacity: 0;
        transition: opacity var(--transition-normal);
    }

    .sidebar-overlay.active {
        display: block;
        opacity: 1;
    }

    /* Mobile Floating Cart Button (POS) */
    .mobile-cart-toggle-btn {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 80;
        background: var(--primary-color);
        color: white;
        padding: 12px 20px;
        border-radius: var(--radius-full);
        box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
        font-weight: 600;
        font-size: 14px;
        align-items: center;
        gap: 10px;
    }

    .mobile-cart-toggle-btn .cart-badge-count {
        background: white;
        color: var(--primary-color);
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
    }

    /* =========================================================
       MEDIA QUERIES (RESPONSIVE BREAKPOINTS)
       ========================================================= */

    /* Tablet & Medium Screens (< 1024px) */
    @media (max-width: 1024px) {
        .pos-container {
            flex-direction: column !important;
            height: auto !important;
            overflow: visible !important;
        }

        .pos-products {
            overflow: visible !important;
        }

        .pos-cart {
            width: 100% !important;
            margin-top: 16px;
        }

        .product-grid {
